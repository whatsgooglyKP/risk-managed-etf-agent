# Free intraday risk monitor on GitHub Actions: every 20 minutes during US market hours it
# re-marks the account with Alpaca's free real-time IEX prices and enforces the $60 hard
# floor, the daily loss cap and the drawdown limit (see src/trading_agent/execution/monitor.py).
# No forecasting, so each run is short (~1 billed minute).
#
# Cost: ~27 scheduled runs per weekday (runs outside market hours exit immediately) is about
# 570 billed minutes/month. Private repos get 2,000 free minutes/month (with the daily run's
# ~60 that is well inside the free tier); public repos are free without limit.
# Honest caveat: GitHub may delay scheduled runs by several minutes under load, so this is a
# safety net, not tick-by-tick protection. For tighter checks run `trading-agent monitor --loop`
# on your own computer.
#
# Uses the same secrets / variables as daily-trade.yml.
name: Intraday risk monitor

on:
  schedule:
    - cron: "*/20 13-21 * * 1-5"   # 09:00-17:40 ET (EDT) / 08:00-16:40 ET (EST); the script checks the clock
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and log, place no orders"
        type: boolean
        default: true

# Shared with daily-trade.yml so the two never edit state/ at the same time.
concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: trading-state-${{ github.run_id }}
          restore-keys: trading-state-

      - name: Run one monitor check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          ARGS=""
          CONF=""
          if [ -n "${{ vars.TRADING_CONFIG }}" ]; then CONF="--config ${{ vars.TRADING_CONFIG }}"; fi
          if [ "${{ vars.TRADING_LIVE }}" = "true" ]; then ARGS="$ARGS --live"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          trading-agent $CONF monitor $ARGS

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: trading-state-${{ github.run_id }}

      - name: Upload monitor log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ github.run_id }}
          path: |
            logs/
            state/monitor.csv
          retention-days: 30
